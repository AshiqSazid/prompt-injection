  # differ only in whether the planted platform canary is a name the model has
  # seen (`Cursor Runtime`) or seed-derived entropy (`Ivdgro Runtime`). Both
  # prompts are the same length in characters, so length cannot explain a gap.
  # `framework` separates the arms because the payload is not a row field.
