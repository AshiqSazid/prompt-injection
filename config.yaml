  # === R1 — fact x field. Does the channel move identifier-shaped CONTENT, or
  # whatever ANSWERS THE DECLARED FIELD? One payload (long_block_v2: six planted
  # facts, single confidentiality cue) crossed with five benign fields, each
  # aimed at a different fact. Score with: analyze.py --matrix
  # Shape-restriction predicts only the `platform` column fills. Field-content
  # matching predicts the diagonal fills -- which would mean the severity bound
  # is an artifact of only ever having declared one field.
  r1_field_fact_probe:
    models:
      - {provider: openai, model: gpt-4o, payload: long_block_v2, wording_style: api_documentation, framework: payload_long_block_v2}
